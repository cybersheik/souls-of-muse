name: offline-checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      # Outbound disclosure gate (docs/DISCLOSURE_POLICY.md). The optional
      # DISCLOSURE_DENYLIST secret holds internal names; the script never
      # prints its terms. Fork PRs run without it.
      - name: Disclosure check (tracked files)
        env:
          DISCLOSURE_DENYLIST: ${{ secrets.DISCLOSURE_DENYLIST }}
        run: python scripts/disclosure_check.py
      - name: Disclosure check (new commit messages)
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000')
        env:
          DISCLOSURE_DENYLIST: ${{ secrets.DISCLOSURE_DENYLIST }}
          RANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          RANGE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/disclosure_check.py --commits "$RANGE_BASE..$RANGE_HEAD" scripts/disclosure_check.py
      - run: python -m pip install -r harness-bench/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s tests -v
        working-directory: harness-bench
